name: Update cask

# Follows the releases of alxbdn/EzReader: when the latest one has a macOS
# disk image, the cask points at it (version and checksum).

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/alxbdn/EzReader/releases/latest --jq .tag_name)"
          VERSION="${TAG#v}"
          ASSET="ezreader-${VERSION}-macos-universal.dmg"
          URL="https://github.com/alxbdn/EzReader/releases/download/${TAG}/${ASSET}"
          CURRENT="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/ezreader.rb)"
          if [[ "$CURRENT" == "$VERSION" ]] && ! grep -q 'sha256 "0\{64\}"' Casks/ezreader.rb; then
            echo "Already at ${VERSION}"; exit 0
          fi
          if ! curl -fsSL -o ezreader.dmg "$URL"; then
            echo "${TAG} has no macOS disk image (yet)"; exit 0
          fi
          SHA="$(sha256sum ezreader.dmg | cut -d' ' -f1)"
          rm ezreader.dmg
          sed -i "s/^  version \".*\"$/  version \"${VERSION}\"/; s/^  sha256 \".*\"$/  sha256 \"${SHA}\"/" Casks/ezreader.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ezreader ${VERSION}"
          git push
